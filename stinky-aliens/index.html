<style>
/* Layout: one portrait 9:16 arcade screen, letterboxed and centred; HTML overlays sit on top of a pixel canvas */
:root{
  --night:#15173a; --ink:#0e0f22; --cream:#f5f1e6; --sun:#ffd23f;
  --slime:#7ed957; --lilac:#c9b8ff; --teal:#6fe0ea;
  --display:'Press Start 2P', 'Courier New', monospace;
  --body:'VT323', 'Courier New', monospace;
  color-scheme: dark;
}
html{box-sizing:border-box;height:100%;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;--u:6px;background:var(--night);overflow:hidden;box-shadow:0 0 0 4px #000}
canvas#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--u)*1.4) calc(var(--u)*2);pointer-events:none}
#hearts{display:flex;gap:calc(var(--u)*0.6)}
#hearts svg{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2)}
#score{font-family:var(--display);font-size:calc(var(--u)*2.6);color:var(--sun);text-shadow:2px 2px 0 #000;font-variant-numeric:tabular-nums}

#liamBtn{position:absolute;right:calc(var(--u)*1.6);bottom:calc(var(--u)*1.6);display:flex;flex-direction:column;align-items:center;
  gap:calc(var(--u)*0.6);padding:calc(var(--u)*0.8);background:#272b57;border:3px solid #000;box-shadow:3px 3px 0 #000;min-width:44px;min-height:44px}
#liamBtn canvas{width:calc(var(--u)*7.2);height:calc(var(--u)*7.2);image-rendering:pixelated;display:block}
#pips{display:flex;gap:2px}
#pips i{width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);background:#3b3f73;border:1px solid #000;display:block}
#pips i.on{background:var(--sun)}
#liamBtn.ready{background:var(--sun);animation:pulse .6s steps(2) infinite}
#liamBtn.ready::after{content:'TAP!';position:absolute;top:calc(var(--u)*-2.6);font-family:var(--display);font-size:calc(var(--u)*1.6);color:var(--sun);text-shadow:2px 2px 0 #000}
@keyframes pulse{50%{transform:scale(1.08)}}

#mute{position:absolute;left:calc(var(--u)*1.6);bottom:calc(var(--u)*1.6);width:calc(var(--u)*6);height:calc(var(--u)*6);min-width:44px;min-height:44px;
  display:flex;align-items:center;justify-content:center;background:#272b57;border:3px solid #000;box-shadow:3px 3px 0 #000}
#mute svg{width:60%;height:60%}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2.2);
  padding:calc(var(--u)*4) calc(var(--u)*3);text-align:center;background:rgba(14,15,34,.82)}
.screen h1{margin:0;font-family:var(--display);font-weight:400;line-height:1.25;text-wrap:balance}
.screen h1 .big{display:block;font-size:calc(var(--u)*6);color:var(--sun);text-shadow:4px 4px 0 #000}
.screen h1 .small{display:block;margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*2.2);color:var(--slime);text-shadow:2px 2px 0 #000}
.cast{display:flex;align-items:flex-end;gap:calc(var(--u)*2)}
.cast canvas{image-rendering:pixelated;width:calc(var(--u)*9.6);height:calc(var(--u)*12.8)}
.cast canvas.alien{width:calc(var(--u)*8);height:calc(var(--u)*8);margin-bottom:calc(var(--u)*2);animation:wob .5s steps(2) infinite}
@keyframes wob{50%{transform:translateY(-4px)}}
.how{display:flex;flex-direction:column;gap:calc(var(--u)*0.8);font-size:calc(var(--u)*3);line-height:1.05;max-width:32ch}
.how b{color:var(--teal);font-weight:400}
.how b.y{color:var(--sun)}
.play{font-family:var(--display);font-size:calc(var(--u)*3);padding:calc(var(--u)*1.8) calc(var(--u)*3.4);background:var(--slime);color:#000;
  border:4px solid #000;box-shadow:5px 5px 0 #000;min-height:44px}
.play:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
.best{font-size:calc(var(--u)*2.6);color:var(--lilac)}
#overMsg{font-size:calc(var(--u)*3.2);max-width:26ch;line-height:1.05}
#overScore{font-family:var(--display);font-size:calc(var(--u)*3.4);color:var(--sun);text-shadow:3px 3px 0 #000;line-height:1.5}
@media (prefers-reduced-motion: reduce){#liamBtn.ready,.cast canvas.alien{animation:none}}
</style>

const ALIEN_A = ALIEN_TOP.concat(['..KGKGGKKGGKGK..','..KK.KK..KK.KK..']);
const ALIEN_B = ALIEN_TOP.concat(['..KGKGGKKGGKGK..','.KK..KK..KK..KK.']);
const STAR = ['....K....','...KYK...','KKKYYYKKK','KYYYYYYYK','.KYYYYYK.','..KYYYK..','.KYYKYYK.','.KYK.KYK.','.KK...KK.'];

function sprite(rows, pal) {
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const x = c.getContext('2d');
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const col = pal[r[i]]; if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } } });
  return c;
}
const green = Object.assign({}, PAL, { G:'#7ed957', g:'#4fa83a', P:'#c86bfa' });
const purple = Object.assign({}, PAL, { G:'#b07cf0', g:'#7e4fcf', P:'#ffd23f' });
const SPR = {
  elliot: sprite(ELLIOT, PAL), liam: sprite(LIAM, PAL),
  aG: [sprite(ALIEN_A, green), sprite(ALIEN_B, green)],
  aP: [sprite(ALIEN_A, purple), sprite(ALIEN_B, purple)],
  star: sprite(STAR, { K:'#1b1622', Y:'#ffd23f' })
};
function paintInto(id, img, sx, sy, sw, sh) {
  const c = document.getElementById(id), x = c.getContext('2d');
  x.imageSmoothingEnabled = false; x.clearRect(0, 0, c.width, c.height);
  x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
}
paintInto('castE', SPR.elliot, 0, 0, 24, 32);
paintInto('castL', SPR.liam, 0, 0, 24, 32);
paintInto('castA', SPR.aG[0], 0, 0, 16, 16);
paintInto('liamFace', SPR.liam, 4, 4, 16, 16);

/* ---------- sound ---------- */
let ac = null, muted = false;
function ensureAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } } if (ac && ac.state === 'suspended') ac.resume(); }
function tone(f1, f2, dur, type, vol, delay) {
  if (!ac || muted) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  pop() { tone(420, 900, .09, 'sine', .22); },
  hit() { tone(320, 70, .16, 'square', .1); tone(900, 1500, .1, 'triangle', .08, .04); },
  star() { [660, 880, 1320].forEach((f, i) => tone(f, f * 1.01, .08, 'square', .08, i * .07)); },
  giggle() { for (let i = 0; i < 10; i++) tone(i % 2 ? 980 : 720, i % 2 ? 860 : 640, .07, 'triangle', .16, i * .085); },
  stink() { tone(520, 300, .25, 'sawtooth', .09); tone(380, 150, .4, 'sawtooth', .09, .26); },
  cheer() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, .1, 'square', .08, i * .08)); }
};

/* ---------- dom ---------- */
const $ = id => document.getElementById(id);
const app = $('app'), stage = $('stage'), cv = $('c'), ctx = cv.getContext('2d');
const heartsEl = $('hearts'), scoreEl = $('score'), liamBtn = $('liamBtn'), pips = [...document.querySelectorAll('#pips i')];
const heartSvg = on => `<svg viewBox="0 0 7 6" shape-rendering="crispEdges"><path fill="${on ? '#ff5a6e' : '#3b3f73'}" stroke="#000" stroke-width=".5" d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z"/></svg>`;
const speakerSvg = on => `<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="#f5f1e6" d="M0 3h2V2h1V1h1v6H3V6H2V5H0z"/>${on ? '<path fill="#f5f1e6" d="M5 2h1v1H5zM5 5h1v1H5zM6 3h1v2H6z"/>' : '<path fill="#ff5a6e" d="M5 2h1v1H5zM6 3h1v1H6zM7 4h1v1H7zM5 5h1v1H5zM7 2h1v1H7zM6 4h1v1H6z"/>'}</svg>`;
function getBest() { try { return +localStorage.getItem('elliot-aliens-best') || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem('elliot-aliens-best', String(v)); } catch (e) {} }
function showBest() { const b = getBest(); const txt = b ? 'Best: ' + b + ' aliens' : ''; $('bestTitle').textContent = txt; $('bestOver').textContent = txt; }
showBest();
$('mute').innerHTML = speakerSvg(true);
$('mute').addEventListener('click', () => { muted = !muted; $('mute').innerHTML = speakerSvg(!muted); $('mute').setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); });

let S = 3;
function fit() {
  const W = app.clientWidth, H = app.clientHeight;
  let h = H, w = h * 9 / 16;
  if (w > W) { w = W; h = w * 16 / 9; }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.setProperty('--u', (h / 100) + 'px');
  S = Math.max(1, Math.ceil(h * (window.devicePixelRatio || 1) / LH));
  cv.width = LW * S; cv.height = LH * S;
}
addEventListener('resize', fit); fit();

/* ---------- world ---------- */
const sky = Array.from({ length: 40 }, () => ({ x: Math.random() * LW, y: Math.random() * 200, p: Math.random() * 6 }));
const tufts = Array.from({ length: 26 }, () => ({ x: Math.random() * LW, y: 268 + Math.random() * 48 }));
const flowers = [[14, 304, '#ff9ecb'], [62, 312, '#ffd23f'], [118, 306, '#c9b8ff'], [168, 314, '#ff9ecb'], [100, 316, '#ffffff']];
const CHEERS = ['SUPER!', 'WOW!', 'YEAH ELLIOT!', 'SO CLEAN!', 'AMAZING!'];

let G;
function newGame() {
  G = { state: 'play', t: 0, score: 0, hearts: 5, charge: 0, aliens: [], bubbles: [], stars: [], parts: [], texts: [], rings: [],
    spawnT: 1.6, starT: 5, nextLane: 1, lastLanes: [], ufo: { x: 90 }, elliot: { lane: 1, x: 90, throwT: 0, squash: 0 }, liam: null, shake: 0 };
  drawHud();
}
function drawHud() {
  heartsEl.innerHTML = Array.from({ length: 5 }, (_, i) => heartSvg(i < G.hearts)).join('');
  scoreEl.textContent = G.score;
  pips.forEach((p, i) => p.classList.toggle('on', i < G.charge));
  liamBtn.classList.toggle('ready', G.charge >= 5 && !G.liam);
}
function pickLane() {
  let l = Math.floor(Math.random() * 3);
  if (G.lastLanes.length >= 2 && G.lastLanes.every(v => v === l)) l = (l + 1 + Math.floor(Math.random() * 2)) % 3;
  G.lastLanes = G.lastLanes.concat(l).slice(-2);
  return l;
}
function burst(x, y, cols, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (spd || 40) * (.4 + Math.random());
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5 + Math.random() * .4, max: .9, col: cols[i % cols.length], size: 1 + Math.random() * 2.2 });
  }
}
function say(x, y, txt, col) { G.texts.push({ x, y, txt, col: col || '#ffd23f', life: 1.1 }); }
function popAlien(a, viaLiam) {
  burst(a.x, a.y + 8, ['#ffffff', '#bfe9ff', '#7ed957'], 14, 50);
  a.dead = true; G.score++;
  if (G.score % 10 === 0) { say(90, 150, CHEERS[(G.score / 10 - 1) % CHEERS.length], '#7ed957'); sfx.cheer(); }
  if (!viaLiam && G.charge < 5 && Math.random() < .3) dropStar(a.x, a.y);
}
function dropStar(x, y) { G.stars.push({ x, y, bx: x, t: 0 }); }

function update(dt) {
  G.t += dt;
  const d = Math.min(1, G.t / 160);
  const E = G.elliot;
  E.x += (LANES[E.lane] - E.x) * Math.min(1, dt * 16);
  E.throwT -= dt; E.squash = Math.max(0, E.squash - dt);
  G.shake = Math.max(0, G.shake - dt);

  // ufo glides to the next lane, then drops an alien
  G.ufo.x += (LANES[G.nextLane] - G.ufo.x) * Math.min(1, dt * 3);
  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    const big = d > .35 && Math.random() < .22;
    G.aliens.push({ x: LANES[G.nextLane], y: 26, v: 13 + 22 * d + Math.random() * 4, hp: big ? 2 : 1, big, t: Math.random() * 2, hitT: 0 });
    G.beam = { x: LANES[G.nextLane], life: .35 };
    G.nextLane = pickLane();
    G.spawnT = 2.5 - 1.45 * d + Math.random() * .5;
  }
  if (G.beam) { G.beam.life -= dt; if (G.beam.life <= 0) G.beam = null; }

  // free stars from the sky now and then
  G.starT -= dt;
  if (G.starT <= 0) { dropStar(20 + Math.random() * 140, -8); G.starT = 7 + Math.random() * 4; }

  for (const a of G.aliens) {
    a.t += dt; a.hitT = Math.max(0, a.hitT - dt);
    a.y += a.v * dt;
    if (a.y + 16 >= FENCE && !a.dead) {
      a.dead = true; G.hearts--; G.shake = .35;
      burst(a.x, FENCE, ['#7ed957', '#a6e36b', '#4fa83a'], 22, 35);
      say(a.x, FENCE - 20, 'PEE-YEW!', '#7ed957'); sfx.stink();
      try { navigator.vibrate && navigator.vibrate(80); } catch (e) {}
      drawHud();
      if (G.hearts <= 0) return gameOver();
    }
  }
  for (const b of G.bubbles) {
    b.y -= 175 * dt; b.t += dt;
    for (const a of G.aliens) {
      if (a.dead || b.dead || Math.abs(a.x - b.x) > 12) continue;
      if (b.y < a.y + 18 && b.y > a.y - 4) {
        b.dead = true; a.hp--; a.hitT = .15; sfx.hit();
        if (a.hp <= 0) { popAlien(a); drawHud(); } else burst(a.x, a.y + 8, ['#ffffff', '#bfe9ff'], 6, 30);
      }
    }
    if (b.y < -10) b.dead = true;
  }
  for (const s of G.stars) { s.t += dt; s.y += 20 * dt; s.x = s.bx + Math.sin(s.t * 2.2) * 8; if (s.y > LH + 10) s.dead = true; }

  if (G.liam) {
    const Lm = G.liam; Lm.t += dt; Lm.x += 110 * dt;
    if (Lm.t > .15 && Lm.t < 1.6 && Math.floor(Lm.t * 6) !== Lm.lastRing) { Lm.lastRing = Math.floor(Lm.t * 6); G.rings.push({ x: Lm.x, y: 286, r: 4 }); }
    if (Lm.x > LW + 30) { G.liam = null; drawHud(); }
  }
  for (const r of G.rings) {
    r.r += 230 * dt;
    for (const a of G.aliens) if (!a.dead && Math.hypot(a.x - r.x, a.y + 8 - r.y) < r.r) popAlien(a, true);
    if (r.r > 420) r.dead = true;
  }
  if (G.rings.length) drawHud();

  for (const p of G.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 30 * dt; if (p.life <= 0) p.dead = true; }
  for (const t of G.texts) { t.life -= dt; t.y -= 14 * dt; if (t.life <= 0) t.dead = true; }
  ['aliens', 'bubbles', 'stars', 'parts', 'texts', 'rings'].forEach(k => { G[k] = G[k].filter(o => !o.dead); });
}

/* ---------- drawing ---------- */
function px(x) { return Math.round(x); }
function render(now) {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const shake = (!reduceMotion && G && G.shake > 0) ? Math.sin(now / 20) * 2 : 0;
  ctx.save(); ctx.translate(shake, 0);

  // sky
  ctx.fillStyle = '#15173a'; ctx.fillRect(-4, 0, LW + 8, 120);
  ctx.fillStyle = '#1d2150'; ctx.fillRect(-4, 120, LW + 8, 80);
  ctx.fillStyle = '#262b62'; ctx.fillRect(-4, 200, LW + 8, 70);
  for (const s of sky) { ctx.fillStyle = (Math.sin(now / 400 + s.p) > .2) ? '#f5f1e6' : '#6d70a8'; ctx.fillRect(px(s.x), px(s.y), 1, 1); }
  ctx.fillStyle = '#f5f1e6'; ctx.beginPath(); ctx.arc(150, 58, 11, 0, 7); ctx.fill();
  ctx.fillStyle = '#d9d3c2'; ctx.fillRect(145, 54, 3, 3); ctx.fillRect(153, 61, 2, 2);
  // hills
  ctx.fillStyle = '#1b3b3a'; ctx.beginPath(); ctx.moveTo(-4, 250); ctx.quadraticCurveTo(40, 214, 90, 244); ctx.quadraticCurveTo(140, 220, LW + 4, 246); ctx.lineTo(LW + 4, 270); ctx.lineTo(-4, 270); ctx.fill();
  // lane guides
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let y = 44; y < FENCE; y += 8) { ctx.fillRect(60, y, 1, 4); ctx.fillRect(120, y, 1, 4); }

  if (!G) { ctx.restore(); return; }

  // ufo + beam
  if (G.beam) { ctx.fillStyle = 'rgba(201,184,255,' + (G.beam.life * 1.3) + ')'; ctx.beginPath(); ctx.moveTo(G.beam.x - 5, 30); ctx.lineTo(G.beam.x + 5, 30); ctx.lineTo(G.beam.x + 12, 46); ctx.lineTo(G.beam.x - 12, 46); ctx.fill(); }
  const ux = px(G.ufo.x), uy = 20 + Math.round(Math.sin(now / 300) * 1.5);
  ctx.fillStyle = '#9fe0ff'; ctx.beginPath(); ctx.arc(ux, uy - 2, 7, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#1b1622'; ctx.fillRect(ux - 17, uy - 1, 34, 8);
  ctx.fillStyle = '#c9b8ff'; ctx.fillRect(ux - 16, uy, 32, 6);
  ctx.fillStyle = '#8a75d6'; ctx.fillRect(ux - 16, uy + 4, 32, 2);
  for (let i = 0; i < 4; i++) { ctx.fillStyle = (Math.floor(now / 200) + i) % 2 ? '#ffd23f' : '#ff5a6e'; ctx.fillRect(ux - 12 + i * 7, uy + 2, 3, 2); }

  // aliens
  for (const a of G.aliens) {
    const fr = Math.floor(a.t * 4) % 2, set = a.big ? SPR.aP : SPR.aG, sc = a.big ? 1.25 : 1;
    const w = 16 * sc, x = px(a.x - w / 2), y = px(a.y - (sc - 1) * 16);
    // stink lines
    ctx.fillStyle = a.big ? '#c9a6ff' : '#a6e36b';
    for (let i = 0; i < 3; i++) { const sx = a.x - 6 + i * 6, ph = a.t * 6 + i * 2; for (let k = 0; k < 4; k++) ctx.fillRect(px(sx + Math.sin(ph + k) * 1.5), y - 3 - k * 2, 1, 1); }
    if (a.hitT > 0) ctx.globalAlpha = .5;
    ctx.drawImage(set[fr], x, y, w, w);
    ctx.globalAlpha = 1;
  }

  // fence
  ctx.fillStyle = '#e9e1cf';
  for (let x = 2; x < LW; x += 8) { ctx.fillRect(x, FENCE - 4, 5, 14); ctx.fillRect(x + 1, FENCE - 6, 3, 2); }
  ctx.fillRect(0, FENCE, LW, 2); ctx.fillRect(0, FENCE + 6, LW, 2);
  // garden
  ctx.fillStyle = '#5aa33c'; ctx.fillRect(-4, 268, LW + 8, 52);
  ctx.fillStyle = '#3d7a27'; ctx.fillRect(-4, 268, LW + 8, 3);
  for (const t of tufts) { ctx.fillRect(px(t.x), px(t.y), 1, 2); ctx.fillRect(px(t.x) + 2, px(t.y) + 1, 1, 2); }
  for (const f of flowers) { ctx.fillStyle = f[2]; ctx.fillRect(f[0] - 1, f[1], 3, 1); ctx.fillRect(f[0], f[1] - 1, 1, 3); ctx.fillStyle = '#ffd23f'; ctx.fillRect(f[0], f[1], 1, 1); }

  // bubbles
  for (const b of G.bubbles) {
    const r = 5 + Math.sin(b.t * 12) * .6;
    ctx.fillStyle = 'rgba(191,233,255,0.45)'; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#e9f8ff'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(px(b.x - 3), px(b.y - 3), 2, 2);
  }

  // elliot
  const E = G.elliot, bob = Math.floor(now / 350) % 2;
  const sq = E.squash > 0 ? 1 : 0;
  ctx.drawImage(SPR.elliot, px(E.x - 12), 270 + bob + sq, 24, 32 - sq);

  // stars
  for (const s of G.stars) { const tw = Math.floor(s.t * 5) % 2; ctx.drawImage(SPR.star, px(s.x - 6 - tw), px(s.y - 6 - tw), 13 + tw * 2, 13 + tw * 2); }

  // liam + giggle rings
  for (const r of G.rings) { ctx.strokeStyle = 'rgba(255,210,63,' + Math.max(0, 1 - r.r / 420) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); }
  if (G.liam) {
    const hop = Math.abs(Math.sin(G.liam.t * 14)) * 5;
    ctx.drawImage(SPR.liam, px(G.liam.x - 12), px(272 - hop), 24, 32);
    if (Math.floor(G.liam.t * 4) % 2 === 0) text('HA', G.liam.x + 10, 262 - hop, '#ffd23f', 7);
  }

  // particles + floating words
  for (const p of G.parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.fillRect(px(p.x), px(p.y), Math.ceil(p.size), Math.ceil(p.size)); }
  ctx.globalAlpha = 1;
  for (const t of G.texts) { ctx.globalAlpha = Math.min(1, t.life * 2); text(t.txt, t.x, t.y, t.col, 8); }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function text(s, x, y, col, size) {
  ctx.font = size + 'px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(s).width; x = Math.min(LW - w / 2 - 2, Math.max(w / 2 + 2, x));
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1); ctx.fillStyle = col; ctx.fillText(s, x, y);
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!G || G.state !== 'play') return;
  ensureAudio();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * LW, y = (e.clientY - r.top) / r.height * LH;
  for (const s of G.stars) {
    if (Math.hypot(s.x - x, s.y - y) < 18) {
      s.dead = true; G.charge = Math.min(5, G.charge + 1);
      burst(s.x, s.y, ['#ffd23f', '#ffffff'], 10, 40); sfx.star();
      say(s.x, s.y - 10, G.charge >= 5 ? 'LIAM IS READY!' : '+1', '#ffd23f'); drawHud(); return;
    }
  }
  const lane = x < 60 ? 0 : x < 120 ? 1 : 2;
  G.elliot.lane = lane;
  if (G.elliot.throwT <= 0) {
    G.bubbles.push({ x: LANES[lane], y: 268, t: 0 });
    G.elliot.throwT = .2; G.elliot.squash = .1; sfx.pop();
  }
});
liamBtn.addEventListener('click', () => {
  if (!G || G.state !== 'play' || G.charge < 5 || G.liam) return;
  ensureAudio();
  G.charge = 0; G.liam = { x: -14, t: 0, lastRing: -1 };
  say(90, 120, 'GIGGLE SHOCKWAVE!', '#ffd23f'); sfx.giggle(); drawHud();
});

/* ---------- screens + loop ---------- */
function start() {
  ensureAudio(); newGame();
  $('titleScreen').hidden = true; $('overScreen').hidden = true;
}
function gameOver() {
  G.state = 'over';
  const best = getBest(); if (G.score > best) setBest(G.score); showBest();
  $('overScore').textContent = G.score === 1 ? '1 alien cleaned' : G.score + ' aliens cleaned';
  $('overMsg').textContent = G.score > best && best > 0 ? 'New record! The garden still got a bit stinky though.' : 'The stinky aliens got into the garden!';
  setTimeout(() => { $('overScreen').hidden = false; $('againBtn').focus(); }, 700);
}
$('playBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', start);

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G && G.state === 'play' && !document.hidden) update(dt);
  else if (G && G.state === 'over') { for (const p of G.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; } G.parts = G.parts.filter(p => p.life > 0); }
  render(now);
  requestAnimationFrame(loop);
}
// a quiet attract scene behind the title screen
G = { state: 'title', t: 0, score: 0, hearts: 5, charge: 0, aliens: [{ x: 90, y: 120, v: 0, hp: 1, t: 0, hitT: 0 }, { x: 30, y: 170, v: 0, hp: 2, big: true, t: 1, hitT: 0 }],
  bubbles: [], stars: [{ x: 150, y: 150, bx: 150, t: 0 }], parts: [], texts: [], rings: [], ufo: { x: 90 }, elliot: { lane: 1, x: 90, throwT: 0, squash: 0 }, liam: null, shake: 0 };
drawHud();
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
requestAnimationFrame(loop);
})();
</script>
