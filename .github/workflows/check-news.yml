# Manual health check for Daily Deck's news endpoint (run from the Actions tab).
name: Check Daily Deck feeds
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query each group
        run: |
          for g in world tech science business health culture sport environment good wonders green nope; do
            body=$(curl -s -m 40 "https://lab.organikreations.com/news/api.php?groups=$g")
            echo "== $g"; echo "$body" | jq -c '{groups, failed, items: (.items|length), images: ([.items[]|select(.image!=null)]|length), first: (.items[0]|{source,title})}' 2>/dev/null || echo "${body:0:200}"
          done
          curl -sI "https://lab.organikreations.com/news/api.php?groups=green" | grep -iE "cache|x-litespeed|age|server"
