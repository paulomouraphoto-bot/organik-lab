<style>
:root{--bg:#f6f1e7;--paper:#fffdf8;--ink:#2a2620;--muted:#6f675b;--line:#e3d9c6;--pine:#2f5244;--rust:#b4572e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171a17;--paper:#1f2320;--ink:#ece6d9;--muted:#a49c8d;--line:#343a35;--pine:#8cbfa6;--rust:#e08a5f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Work Sans","Helvetica Neue",Arial,sans-serif;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;text-align:center}
svg{color:var(--pine);margin:0 auto}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;margin:0}
p{margin:0;color:var(--muted);font-size:15px}
input[type=password]{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
input:focus-visible,button:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
button{font:500 16px inherit;font-family:inherit;padding:12px;border:0;border-radius:12px;background:var(--pine);color:var(--paper);cursor:pointer}
label{font-size:14px;color:var(--muted);display:flex;gap:8px;justify-content:center;align-items:center}
.err{color:var(--rust);font-size:14px;min-height:1.2em}
.mk{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.ct));
  return new TextDecoder().decode(pt);
}
function render(html){document.open();document.write(html);document.close()}
const err=document.getElementById('err'),btn=document.getElementById('go');
if(!window.crypto||!crypto.subtle){err.textContent='This browser can\'t open the page (needs HTTPS and a modern browser).'}
(async()=>{let s=null;try{s=localStorage.getItem('wed.pass')}catch(e){}
  if(s){try{render(await open(s));return}catch(e){try{localStorage.removeItem('wed.pass')}catch(_){}}}})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value.trim();if(!pw)return;
  btn.disabled=true;btn.textContent='Opening…';err.textContent='';
  try{const html=await open(pw);
    if(document.getElementById('rem').checked){try{localStorage.setItem('wed.pass',pw)}catch(_){}}
    render(html);
  }catch(x){err.textContent='That password didn\'t work.';btn.disabled=false;btn.textContent='Open'}
});
</script>
